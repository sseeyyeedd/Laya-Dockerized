services:
  laya:
    build:
      context: .
      args:
        # Pull the base image through the Liara docker mirror
        BASE_IMAGE: docker-mirror.liara.ir/library/python:3.12-slim
    container_name: laya
    restart: unless-stopped

    ports:
      - "8000:8000"

    environment:
      USE_TF: "0"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HOME: /model
      # Un-comment to route hub traffic through a mirror:
      # HF_ENDPOINT: https://hf-mirror.com

    networks:
      - ai

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s

networks:
  ai:
    driver: bridge